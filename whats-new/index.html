<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's New - RankTime</title>
  <meta name="description" content="Everything that has shipped in RankTime, newest version first.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ranktime.app/whats-new/">
  <meta property="og:title" content="What's New - RankTime">
  <meta property="og:description" content="Everything that has shipped in RankTime, newest version first.">
  <meta property="og:image" content="https://ranktime.app/og.png?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ranktime.app/og.png?v=3">
  <link rel="canonical" href="https://ranktime.app/whats-new/">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles.css?v=16">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="inner">
      <a class="brand-link" href="/">
        <img class="logo" src="/logo.png" alt="RankTime logo">
        <div class="brand">RankTime</div>
      </a>
      <nav>
        <a href="/">Home</a>
        <a href="/guides/">Guides</a>
        <a href="/whats-new/" aria-current="page">What&#39;s New</a>
        <a href="/whats-next/">What&#39;s Next</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </header>

  <main class="doc">
    <div class="upd-header">
      <a class="g rim circ" href="/" aria-label="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5L7.5 12l7.5 7.5"/></svg></a>
      <h1 class="g rim">What's New</h1>
      <a class="g rim circ" href="/" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <p class="upd-sub">Everything that has shipped, newest version first.</p>

    <div id="content">
      <p class="upd-sub">Loading.</p>
    </div>

    <p class="callout">
      Curious what is coming? See <a href="/whats-next/">What's Next</a>.
    </p>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>&copy; 2026 RankTime</span>
      <nav>
        <a href="/guides/">Guides</a>
        <a href="/whats-new/">What's New</a>
        <a href="/whats-next/">What's Next</a>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/support/">Support</a>
      </nav>
    </div>
  </footer>

  <script>
    // Content comes from /updates.json, the same file the iPhone app reads, so the
    // site and the app can never disagree.
    var esc = function (s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    };

    var prettyDate = function (iso) {
      if (!iso) return '';
      var parts = String(iso).split('-');
      if (parts.length !== 3) return '';
      var months = ['January', 'February', 'March', 'April', 'May', 'June',
                    'July', 'August', 'September', 'October', 'November', 'December'];
      var m = months[parseInt(parts[1], 10) - 1];
      if (!m) return '';
      return m + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
    };

    // WhatsNewView: EmptyStateView with the sparkles symbol, and a lime checkmark per item.
    var sparkles = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2.5l1.6 4.9a3 3 0 0 0 1.9 1.9l4.9 1.6-4.9 1.6a3 3 0 0 0-1.9 1.9L10 19.3l-1.6-4.9a3 3 0 0 0-1.9-1.9L1.6 10.9l4.9-1.6a3 3 0 0 0 1.9-1.9z"/><path d="M19 13.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/><path d="M18.5 1.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg>';
    var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    var empty = function (text) {
      return '<div class="empty-state">' + sparkles + '<h2>Nothing here yet</h2><p>' + text + '</p></div>';
    };

    var render = function (data) {
      var versions = (data && data.versions) || [];
      var host = document.getElementById('content');

      if (!versions.length) {
        host.innerHTML = empty('RankTime has not had its first update yet. When one lands, ' +
                               'every change shows up on this page.');
        return;
      }

      var html = '<div class="upd-list">';
      for (var i = 0; i < versions.length; i++) {
        var v = versions[i];
        var when = prettyDate(v.date);
        html += '<article class="upd-card"><div class="vhead"><b>Version ' + esc(v.version) + '</b>';
        if (when) html += '<span>' + esc(when) + '</span>';
        html += '</div>';
        var items = v.items || [];
        if (items.length) {
          html += '<ul class="upd-items">';
          for (var j = 0; j < items.length; j++) {
            html += '<li>' + check + '<span>' + esc(items[j]) + '</span></li>';
          }
          html += '</ul>';
        }
        html += '</article>';
      }
      host.innerHTML = html + '</div>';
    };

    fetch('/updates.json?t=' + Math.floor(Date.now() / 60000))
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById('content').innerHTML =
          empty('The update list could not be loaded right now. Please try again in a moment.');
      });
  </script>
</body>
</html>
